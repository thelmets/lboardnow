name: Otomatik Veri Guncelleme

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Python Kodunu Çalıştır
        run: python guncelle.py

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git diff --quiet && echo "Degisiklik yok" || (git commit -am "Otomatik skor güncellemesi" && git push)
