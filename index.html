<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Liderlik Tablosu</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 50px; }
        table { margin: 0 auto; border-collapse: collapse; width: 60%; background: #1e1e1e; }
        th, td { padding: 12px; border: 1px solid #333; }
        th { background: #ff9800; color: #000; }
    </style>
</head>
<body>

    <h1>En İyi Minecraft Oyuncuları</h1>
    <table>
        <thead>
            <tr>
                <th>Sıra</th>
                <th>Oyuncu Adı</th>
                <th>Skor / Derece</th>
            </tr>
        </thead>
        <tbody id="oyuncu-listesi">
            <!-- Veriler JavaScript ile buraya eklenecek -->
        </tbody>
    </table>

    <script>
        // Arka plandaki JSON dosyasından verileri çekme
        fetch('oyuncular.json')
            .then(response => response.json())
            .then(data => {
                const tabloGovdesi = document.getElementById('oyuncu-listesi');
                // Verileri işleyip tabloya ekleme mantığı burada döngüyle kurulur
                // Örnek satır:
                tabloGovdesi.innerHTML = `<tr><td>1</td><td>ÖrnekOyuncu</td><td>9999</td></tr>`;
            })
            .catch(error => console.error('Veri yüklenemedi:', error));
    </script>

</body>
</html>
