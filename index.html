<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Liderlik Tablosu</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 50px; }
        table { margin: 0 auto; border-collapse: collapse; width: 70%; background: #1e1e1e; }
        th, td { padding: 12px; border: 1px solid #333; }
        th { background: #ff9800; color: #000; }
        tr:nth-child(even) { background: #1a1a1a; }
    </style>
</head>
<body>

    <h1>En İyi Minecraft Oyuncuları</h1>
    <table>
        <thead>
            <tr>
                <th>Sıra</th>
                <th>Oyuncu Adı</th>
                <th>Seviye</th>
                <th>Kazanılan Maç</th>
                <th>Skor / Derece</th>
            </tr>
        </thead>
        <tbody id="oyuncu-listesi">
            <!-- Veriler JavaScript ile buraya eklenecek -->
        </tbody>
    </table>

    <script>
        fetch('oyuncular.json')
            .then(response => response.json())
            .then(data => {
                const tabloGovdesi = document.getElementById('oyuncu-listesi');
                tabloGovdesi.innerHTML = ""; 

                data.forEach(oyuncu => {
                    const satir = `<tr>
                        <td>${oyuncu.sira}</td>
                        <td>${oyuncu.isim}</td>
                        <td>${oyuncu.seviye}</td>
                        <td>${oyuncu.mac}</td>
                        <td>${oyuncu.skor}</td>
                    </tr>`;
                    tabloGovdesi.innerHTML += satir;
                });
            })
            .catch(error => console.error('Veri yüklenemedi:', error));
    </script>

</body>
</html>
